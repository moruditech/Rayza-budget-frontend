
[[redirects]]
  from = "/*"
  to   = "/index.html"
  status = 200

# ── PWA ────────────────────────────────────────────────────────────────────
# The service worker and manifest must always be revalidated so that a new
# deploy reaches installed apps.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"
